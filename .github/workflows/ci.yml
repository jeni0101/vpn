name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server-web-shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y age bats shellcheck wireguard-tools qrencode
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go test ./... && go vet ./...
        working-directory: server
      - run: tests/run.sh
      - uses: gitleaks/gitleaks-action@v2

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore clients/windows/TNestVPN.sln
      - run: dotnet build clients/windows/TNestVPN.sln -c Release -p:Platform=x64 --no-restore
      - run: dotnet test clients/windows/TNestVPN.sln -c Release -p:Platform=x64 --no-build

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: gradle -p clients/android :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon
