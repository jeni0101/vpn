name: unsigned-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - shell: pwsh
        run: clients/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tnest-vpn-windows-unsigned
          path: |
            clients/windows/artifacts/**
            clients/windows/installer/bin/**

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: gradle -p clients/android :app:assembleRelease --no-daemon
      - run: sha256sum clients/android/app/build/outputs/apk/release/*.apk > clients/android/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tnest-vpn-android-unsigned
          path: |
            clients/android/app/build/outputs/apk/release/*.apk
            clients/android/SHA256SUMS
