server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /latency {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 204;
    }

    location / {
        return 404;
    }
}
