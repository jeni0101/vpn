server {
    listen 80;
    listen [::]:80;
    server_name __VPN_WEB_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __VPN_WEB_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__VPN_WEB_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__VPN_WEB_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/v1/downloads/ {
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
}
